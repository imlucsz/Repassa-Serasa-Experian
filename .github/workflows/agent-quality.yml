name: RePassa quality gates
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repassa-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/agent-guard.test.mjs
      - name: Inspect incoming commits and diff
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD_SHA")
          node scripts/agent-guard.mjs range "$MERGE_BASE" "$HEAD_SHA"
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Frontend tests
        run: npm run test:ci
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: repassa_ci
          POSTGRES_PASSWORD: repassa_ci
          POSTGRES_DB: repassa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repassa_ci -d repassa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # Ephemeral service only; deliberately non-production credentials.
      DATABASE_URL: postgresql://repassa_ci:repassa_ci@127.0.0.1:5432/repassa_ci
      TEST_DATABASE_URL: postgresql://repassa_ci:repassa_ci@127.0.0.1:5432/repassa_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend not yet implemented (foundation only)
        if: hashFiles('backend/package.json') == ''
        run: echo 'Backend bootstrap pending; no backend tests claimed.'
      - name: Install locked backend dependencies
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm ci
      - name: Typecheck and build
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: |
          npm run lint
          npm run build
      - name: Apply migrations to disposable database
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm run db:migrate:deploy
      - name: Run backend tests
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm run test:ci
