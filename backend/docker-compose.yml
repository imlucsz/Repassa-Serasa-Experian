# Local disposable PostgreSQL for development — mirrors CI (postgres:16).
# Credentials are local-only defaults; never reuse them in shared environments.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: repassa_local
      POSTGRES_PASSWORD: repassa_local
      POSTGRES_DB: repassa_local
    ports:
      - '5432:5432'
    volumes:
      - repassa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repassa_local -d repassa_local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repassa-pgdata:
