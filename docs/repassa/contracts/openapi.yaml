          type: string
          minLength: 3
          maxLength: 240
      required:
      - reason
    Reservation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        material:
          $ref: '#/components/schemas/Material'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        expiresAt:
          type: string
          format: date-time
        pickupCode:
          type: string
          nullable: true
