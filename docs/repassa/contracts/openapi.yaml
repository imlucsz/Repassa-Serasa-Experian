      - status
      - expiresAt
      - pickupCode
      - createdAt
      - completedAt
    PickupInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 12
          maxLength: 14
          pattern: ^[0-9A-HJ-KM-NP-TV-Za-hj-km-np-tv-z]{4}-?[0-9A-HJ-KM-NP-TV-Za-hj-km-np-tv-z]{4}-?[0-9A-HJ-KM-NP-TV-Za-hj-km-np-tv-z]{4}$
      required:
      - code
    PickupResult:
