components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: repassa_refresh
  schemas:
    Role:
      type: string
      enum:
      - STUDENT
      - STAFF
      - ADMIN
    Category:
      type: string
      enum:
      - BOOK
      - NOTEBOOK
      - SUPPLIES
      - OTHER
    Condition:
      type: string
      enum:
      - LIKE_NEW
      - GOOD
      - FAIR
    MaterialStatus:
      type: string
      enum:
      - PENDING_RECEIPT
      - AVAILABLE
      - RESERVED
      - DELIVERED
      - CANCELED
      - REJECTED
    ReservationStatus:
      type: string
      enum:
      - ACTIVE
      - CANCELED
      - EXPIRED
      - COMPLETED
    InstitutionStatus:
      type: string
      description: >-
        Lifecycle: PENDING (registered, awaiting admin), APPROVED (admin
        approved), REJECTED (admin rejected — terminal). Only APPROVED +
        isActive institutions appear publicly and can receive donations,
        materials and reservations.
      enum:
      - PENDING
      - APPROVED
      - REJECTED
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
      - message
      - requestId
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
      required:
      - id
      - displayName
      - email
      - role
    RegisterInput:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
      required:
      - displayName
      - email
      - password
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
      required:
      - email
      - password
    ProfileInput:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 80
      required:
      - displayName
    AuthResponse:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/User'
      required:
      - accessToken
      - expiresIn
      - user
    Institution:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        publicAddress:
          type: string
        pickupInstructions:
          type: string
      required:
      - id
      - name
      - publicAddress
      - pickupInstructions
    Material:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        condition:
          $ref: '#/components/schemas/Condition'
        imageUrl:
          type: string
          format: uri
          nullable: true
        institution:
          $ref: '#/components/schemas/Institution'
        status:
          $ref: '#/components/schemas/MaterialStatus'
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - title
      - description
      - category
      - condition
      - imageUrl
      - institution
      - status
      - createdAt
      description: Safe material representation. Public catalog endpoints return only AVAILABLE; private reservation history
        may include other states. No donor identity.
    ManagedMaterial:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        condition:
          $ref: '#/components/schemas/Condition'
        imageUrl:
          type: string
          format: uri
          nullable: true
        institution:
          $ref: '#/components/schemas/Institution'
        status:
          $ref: '#/components/schemas/MaterialStatus'
        createdAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
          nullable: true
        rejectReason:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - title
      - description
      - category
      - condition
      - imageUrl
      - institution
      - status
      - createdAt
      - receivedAt
      - rejectReason
      - updatedAt
      description: Owner/staff representation; no donor personal details.
    DonationInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 1000
        category:
          $ref: '#/components/schemas/Category'
        condition:
          $ref: '#/components/schemas/Condition'
        institutionId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
          nullable: true
      required:
      - title
      - description
      - category
      - condition
      - institutionId
    UploadResult:
      type: object
      additionalProperties: false
      properties:
        uploadId:
          type: string
          format: uuid
      required:
      - uploadId
    RejectInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 240
      required:
      - reason
    Reservation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        material:
          $ref: '#/components/schemas/Material'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        expiresAt:
          type: string
          format: date-time
        pickupCode:
          type: string
          nullable: true
          description: Only owner ACTIVE unexpired; otherwise null.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - material
      - status
      - expiresAt
      - pickupCode
      - createdAt
      - completedAt
    PickupInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 12
          maxLength: 14
          pattern: ^[0-9A-HJ-KM-NP-TV-Za-hj-km-np-tv-z]{4}-?[0-9A-HJ-KM-NP-TV-Za-hj-km-np-tv-z]{4}-?[0-9A-HJ-KM-NP-TV-Za-hj-km-np-tv-z]{4}$
      required:
      - code
    PickupResult:
      type: object
      additionalProperties: false
      properties:
        reservationId:
          type: string
          format: uuid
        materialId:
          type: string
